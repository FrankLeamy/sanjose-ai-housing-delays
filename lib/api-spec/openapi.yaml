openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Permit Correction Helper API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: permits
  - name: questions
  - name: auth
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /signup:
    post:
      operationId: signUp
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthInput"
      responses:
        "201":
          description: Account created and session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
  /login:
    post:
      operationId: logIn
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthInput"
      responses:
        "200":
          description: Session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
  /logout:
    post:
      operationId: logOut
      tags: [auth]
      responses:
        "204":
          description: Session ended
  /me:
    get:
      operationId: getMe
      tags: [auth]
      responses:
        "200":
          description: Current user, or null if not logged in
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthUser"
                  - type: "null"
  /samples:
    get:
      operationId: listSamples
      tags: [permits]
      responses:
        "200":
          description: Sample letters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SampleLetter"
  /analyze:
    post:
      operationId: analyzeLetter
      tags: [permits]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeInput"
      responses:
        "201":
          description: Analysis complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermitReport"
  /reports/{id}:
    get:
      operationId: getReport
      tags: [permits]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Permit report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermitReport"
  /reports:
    get:
      operationId: listReports
      tags: [permits]
      responses:
        "200":
          description: Reports belonging to the current user, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PermitReport"
  /public-permits:
    get:
      operationId: listPublicPermits
      tags: [permits]
      responses:
        "200":
          description: Housing-related records imported from the official City dataset
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicPermit"
  /reports/{reportId}/items/{itemId}:
    patch:
      operationId: updateReportItem
      tags: [permits]
      parameters:
        - in: path
          name: reportId
          required: true
          schema: { type: integer }
        - in: path
          name: itemId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressUpdate"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportItem"
  /notifications:
    get:
      operationId: listNotifications
      tags: [permits]
      responses:
        "200":
          description: Notification history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
  /questions:
    get:
      operationId: listPermitQuestions
      tags: [questions]
      summary: List saved permitting questions, newest first
      responses:
        "200":
          description: Saved questions and answers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PermitQuestion"
    post:
      operationId: askPermitQuestion
      tags: [questions]
      summary: Generate an answer and save the question and answer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermitQuestionInput"
      responses:
        "201":
          description: Answer generated and saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermitQuestion"
components:
  schemas:
    AuthInput:
      type: object
      properties:
        username: { type: string, minLength: 3, maxLength: 30, pattern: "^[a-zA-Z0-9_]+$" }
        password: { type: string, minLength: 8, maxLength: 128 }
      required: [username, password]
      additionalProperties: false
    AuthUser:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, username, createdAt]
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    SampleLetter:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
      required: [id, title, description]
    AnalyzeInput:
      type: object
      properties:
        fileName: { type: string }
        mimeType: { type: string }
        fileData: { type: string, description: Base64 encoded file }
        sampleId: { type: string }
      additionalProperties: false
    PermitReport:
      type: object
      properties:
        id: { type: integer }
        address: { type: string }
        summary: { type: string }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReportItem"
      required: [id, address, summary, createdAt, items]
    PublicPermit:
      type: object
      properties:
        permitNumber: { type: string }
        address: { type: string }
        housingType: { type: string }
        projectDescription: { type: string }
        permitType: { type: string }
        status: { type: string }
        issuedDate:
          oneOf:
            - { type: string, format: date }
            - { type: "null" }
        finalDate:
          oneOf:
            - { type: string, format: date }
            - { type: "null" }
        permitApprovals:
          oneOf:
            - { type: string }
            - { type: "null" }
        sourceUrl: { type: string, format: uri }
        source: { type: string }
        dataLabel: { type: string }
      required: [permitNumber, address, housingType, projectDescription, permitType, status, issuedDate, finalDate, permitApprovals, sourceUrl, source, dataLabel]
    ReportItem:
      type: object
      properties:
        id: { type: integer }
        comment: { type: string }
        status: { type: string, enum: [met, needs_fix] }
        howToFix: { type: string }
        department: { type: string }
        category: { type: string }
        unclear: { type: boolean }
        completed: { type: boolean }
      required: [id, comment, status, howToFix, department, category, unclear, completed]
    ProgressUpdate:
      type: object
      properties:
        completed: { type: boolean }
      required: [completed]
    Notification:
      type: object
      properties:
        id: { type: integer }
        message: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, message, createdAt]
    PermitQuestionInput:
      type: object
      properties:
        question: { type: string, minLength: 1, maxLength: 5000 }
      required: [question]
      additionalProperties: false
    PermitQuestion:
      type: object
      properties:
        id: { type: integer }
        question: { type: string }
        response: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, question, response, createdAt]